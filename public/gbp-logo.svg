<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#00E5C0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00C9A7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="720" fill="#000000"/>

  <!-- Subtle glow -->
  <circle cx="360" cy="320" r="260" fill="url(#glow)"/>

  <!-- Hexagon outline -->
  <path d="M360 160L480 230V370L360 440L240 370V230Z"
        stroke="url(#accent)" stroke-width="6" fill="none"/>

  <!-- Y-lines from center to vertices -->
  <line x1="360" y1="300" x2="360" y2="160" stroke="url(#accent)" stroke-width="4"/>
  <line x1="360" y1="300" x2="480" y2="370" stroke="url(#accent)" stroke-width="4"/>
  <line x1="360" y1="300" x2="240" y2="370" stroke="url(#accent)" stroke-width="4"/>

  <!-- Vertex dots -->
  <circle cx="360" cy="160" r="8" fill="#00C9A7"/>
  <circle cx="480" cy="370" r="8" fill="#00C9A7"/>
  <circle cx="240" cy="370" r="8" fill="#00C9A7"/>

  <!-- Center node -->
  <circle cx="360" cy="300" r="10" fill="url(#accent)"/>

  <!-- Company name -->
  <text x="360" y="520" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">Aethyl</text>

  <!-- Tagline -->
  <text x="360" y="570" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="400" fill="#86868b" letter-spacing="4">TECHNOLOGIES</text>

  <!-- Subtle accent line -->
  <rect x="310" y="490" width="100" height="3" rx="2" fill="url(#accent)" opacity="0.6"/>
</svg>
