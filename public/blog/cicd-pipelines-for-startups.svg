<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#0a1a2a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg8)"/>
  <!-- Pipeline flow -->
  <!-- Step 1: Code -->
  <rect x="80" y="200" width="160" height="120" rx="12" fill="#111" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="160" y="245" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="24">⌨️</text>
  <text x="160" y="275" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="600">Push Code</text>
  <text x="160" y="295" text-anchor="middle" fill="#555" font-family="system-ui" font-size="11">git push</text>
  <!-- Arrow -->
  <line x1="240" y1="260" x2="290" y2="260" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <polygon points="290,255 300,260 290,265" fill="#60a5fa" opacity="0.5"/>
  <!-- Step 2: CI -->
  <rect x="300" y="200" width="160" height="120" rx="12" fill="#111" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="380" y="245" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="24">🔧</text>
  <text x="380" y="275" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="600">GitHub Actions</text>
  <text x="380" y="295" text-anchor="middle" fill="#555" font-family="system-ui" font-size="11">Lint + Test + Build</text>
  <!-- Arrow -->
  <line x1="460" y1="260" x2="510" y2="260" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  <polygon points="510,255 520,260 510,265" fill="#fbbf24" opacity="0.5"/>
  <!-- Step 3: Preview -->
  <rect x="520" y="200" width="160" height="120" rx="12" fill="#111" stroke="#a855f7" stroke-width="1.5"/>
  <text x="600" y="245" text-anchor="middle" fill="#a855f7" font-family="system-ui" font-size="24">👁️</text>
  <text x="600" y="275" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="600">Preview URL</text>
  <text x="600" y="295" text-anchor="middle" fill="#555" font-family="system-ui" font-size="11">Auto deploy preview</text>
  <!-- Arrow -->
  <line x1="680" y1="260" x2="730" y2="260" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <polygon points="730,255 740,260 730,265" fill="#a855f7" opacity="0.5"/>
  <!-- Step 4: Review -->
  <rect x="740" y="200" width="160" height="120" rx="12" fill="#111" stroke="#22c55e" stroke-width="1.5"/>
  <text x="820" y="245" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="24">✅</text>
  <text x="820" y="275" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="600">Code Review</text>
  <text x="820" y="295" text-anchor="middle" fill="#555" font-family="system-ui" font-size="11">Merge to main</text>
  <!-- Arrow -->
  <line x1="900" y1="260" x2="950" y2="260" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
  <polygon points="950,255 960,260 950,265" fill="#22c55e" opacity="0.5"/>
  <!-- Step 5: Deploy -->
  <rect x="960" y="200" width="160" height="120" rx="12" fill="#111" stroke="#22c55e" stroke-width="2"/>
  <rect x="960" y="200" width="160" height="30" rx="12" fill="#22c55e" opacity="0.1"/>
  <text x="1040" y="245" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="24">🚀</text>
  <text x="1040" y="275" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="600">Production</text>
  <text x="1040" y="295" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="11">Live! ⚡</text>

  <!-- Time badge -->
  <rect x="470" y="370" width="260" height="44" rx="22" fill="#22c55e" opacity="0.1"/>
  <text x="600" y="397" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="16" font-weight="700">⚡ Under 5 minutes to production</text>

  <!-- Terminal mockup -->
  <rect x="250" y="440" width="700" height="100" rx="8" fill="#0d1117" stroke="#333" stroke-width="1"/>
  <rect x="250" y="440" width="700" height="24" rx="8" fill="#161b22"/>
  <circle cx="270" cy="452" r="5" fill="#ff5f57"/>
  <circle cx="288" cy="452" r="5" fill="#febc2e"/>
  <circle cx="306" cy="452" r="5" fill="#28c840"/>
  <text x="270" y="490" fill="#7ee787" font-family="monospace" font-size="12">$ git push origin main</text>
  <text x="270" y="508" fill="#8b949e" font-family="monospace" font-size="12">✓ Lint passed  ✓ Tests passed  ✓ Build successful</text>
  <text x="270" y="526" fill="#22c55e" font-family="monospace" font-size="12">🚀 Deployed to production in 4m 32s</text>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="white" font-family="system-ui" font-size="28" font-weight="700">CI/CD Pipelines for Startups</text>
  <text x="600" y="135" text-anchor="middle" fill="#666" font-family="system-ui" font-size="16">Ship faster without breaking things</text>
</svg>
