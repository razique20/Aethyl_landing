  <rect x="760" y="290" width="340" height="100" rx="6" fill="#0d1117"/>
  <rect x="780" y="310" width="120" height="6" rx="2" fill="#7c3aed" opacity="0.7"/>
  <rect x="780" y="325" width="200" height="6" rx="2" fill="#22d3ee" opacity="0.5"/>
  <rect x="780" y="340" width="160" height="6" rx="2" fill="#34d399" opacity="0.5"/>
  <rect x="780" y="355" width="240" height="6" rx="2" fill="#fbbf24" opacity="0.4"/>
