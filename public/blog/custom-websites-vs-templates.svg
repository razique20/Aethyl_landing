  <!-- Left: Template (crossed out) -->
  <rect x="120" y="180" width="340" height="270" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="140" y="200" width="300" height="30" rx="4" fill="#2a2a2a"/>
  <rect x="140" y="245" width="140" height="8" rx="2" fill="#333"/>
  <rect x="140" y="260" width="200" height="6" rx="2" fill="#2a2a2a"/>
