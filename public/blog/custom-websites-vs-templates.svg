  <rect x="860" y="405" width="120" height="36" rx="18" fill="url(#accent1)" opacity="0.9"/>
  <text x="920" y="428" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="600">3× Faster</text>
