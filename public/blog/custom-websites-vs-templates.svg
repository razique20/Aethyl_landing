  <text x="600" y="330" text-anchor="middle" fill="#444" font-family="system-ui" font-size="48" font-weight="800">VS</text>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="white" font-family="system-ui" font-size="28" font-weight="700">Custom Websites vs Templates</text>
  <text x="600" y="575" text-anchor="middle" fill="#666" font-family="system-ui" font-size="16">Why custom-built wins for growing businesses</text>
