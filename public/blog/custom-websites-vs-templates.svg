  <rect x="780" y="192" width="100" height="8" rx="2" fill="#6366f1" opacity="0.8"/>
  <rect x="760" y="230" width="160" height="10" rx="2" fill="#555"/>
  <rect x="760" y="250" width="280" height="6" rx="2" fill="#333"/>
  <rect x="760" y="265" width="240" height="6" rx="2" fill="#333"/>
