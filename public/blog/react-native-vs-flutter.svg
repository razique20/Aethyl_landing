<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <!-- Phone outlines -->
  <!-- React Native phone -->
  <rect x="280" y="100" width="220" height="420" rx="24" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <rect x="290" y="110" width="200" height="400" rx="16" fill="#111"/>
  <!-- RN logo -->
  <circle cx="390" cy="250" r="40" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.8"/>
  <ellipse cx="390" cy="250" rx="25" ry="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
  <ellipse cx="390" cy="250" rx="25" ry="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" transform="rotate(60 390 250)"/>
  <ellipse cx="390" cy="250" rx="25" ry="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" transform="rotate(120 390 250)"/>
  <text x="390" y="340" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="16" font-weight="700">React Native</text>
  <text x="390" y="365" text-anchor="middle" fill="#555" font-family="system-ui" font-size="12">by Meta</text>
  <!-- UI elements -->
  <rect x="310" y="390" width="160" height="24" rx="4" fill="#22d3ee" opacity="0.15"/>
  <rect x="310" y="422" width="160" height="24" rx="4" fill="#22d3ee" opacity="0.1"/>
  <!-- Flutter phone -->
  <rect x="700" y="100" width="220" height="420" rx="24" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  <rect x="710" y="110" width="200" height="400" rx="16" fill="#111"/>
  <!-- Flutter logo -->
  <path d="M790 220 L830 260 L790 300 L750 260 Z" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.8"/>
  <path d="M810 240 L830 260 L810 280" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <text x="810" y="340" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="16" font-weight="700">Flutter</text>
  <text x="810" y="365" text-anchor="middle" fill="#555" font-family="system-ui" font-size="12">by Google</text>
  <!-- UI elements -->
  <rect x="730" y="390" width="160" height="24" rx="4" fill="#60a5fa" opacity="0.15"/>
  <rect x="730" y="422" width="160" height="24" rx="4" fill="#60a5fa" opacity="0.1"/>
  <!-- VS -->
  <text x="600" y="320" text-anchor="middle" fill="#333" font-family="system-ui" font-size="56" font-weight="900">VS</text>
  <!-- Connecting dots -->
  <line x1="500" y1="310" x2="700" y2="310" stroke="#333" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <!-- Title -->
  <text x="600" y="560" text-anchor="middle" fill="white" font-family="system-ui" font-size="28" font-weight="700">React Native vs Flutter 2026</text>
  <text x="600" y="590" text-anchor="middle" fill="#666" font-family="system-ui" font-size="16">Cross-platform mobile development compared</text>
</svg>
