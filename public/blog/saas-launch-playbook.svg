<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#0f2027"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg5)"/>
  <!-- Growth chart -->
  <g opacity="0.6">
    <!-- Axes -->
    <line x1="200" y1="450" x2="1000" y2="450" stroke="#333" stroke-width="1"/>
    <line x1="200" y1="100" x2="200" y2="450" stroke="#333" stroke-width="1"/>
    <!-- Grid lines -->
    <line x1="200" y1="380" x2="1000" y2="380" stroke="#222" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="200" y1="310" x2="1000" y2="310" stroke="#222" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="200" y1="240" x2="1000" y2="240" stroke="#222" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="200" y1="170" x2="1000" y2="170" stroke="#222" stroke-width="0.5" stroke-dasharray="4,4"/>
    <!-- Growth curve -->
    <polyline points="200,430 300,420 400,400 500,370 600,320 700,250 800,180 900,130 1000,110"
      fill="none" stroke="#22c55e" stroke-width="3" opacity="0.8"/>
    <!-- Area fill -->
    <polygon points="200,430 300,420 400,400 500,370 600,320 700,250 800,180 900,130 1000,110 1000,450 200,450"
      fill="#22c55e" opacity="0.05"/>
    <!-- Data points -->
    <circle cx="500" cy="370" r="5" fill="#22c55e" opacity="0.8"/>
    <circle cx="700" cy="250" r="5" fill="#22c55e" opacity="0.8"/>
    <circle cx="900" cy="130" r="5" fill="#22c55e" opacity="0.8"/>
  </g>
  <!-- Step labels along bottom -->
  <g font-family="system-ui" font-size="11" fill="#555" text-anchor="middle">
    <text x="250" y="480">Validate</text>
    <text x="400" y="480">Build MVP</text>
    <text x="550" y="480">Launch</text>
    <text x="700" y="480">Acquire</text>
    <text x="850" y="480">Scale</text>
    <text x="1000" y="480">$1M ARR</text>
  </g>
  <!-- Milestone markers -->
  <rect x="220" y="500" width="60" height="20" rx="4" fill="#22c55e" opacity="0.15"/>
  <text x="250" y="514" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="9" font-weight="600">WEEK 1</text>
  <rect x="520" y="500" width="60" height="20" rx="4" fill="#22c55e" opacity="0.15"/>
  <text x="550" y="514" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="9" font-weight="600">MONTH 3</text>
  <rect x="820" y="500" width="60" height="20" rx="4" fill="#22c55e" opacity="0.15"/>
  <text x="850" y="514" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="9" font-weight="600">MONTH 12</text>
  <!-- Rocket icon -->
  <text x="1000" y="105" text-anchor="middle" font-size="28">🚀</text>
  <!-- Title -->
  <text x="600" y="560" text-anchor="middle" fill="white" font-family="system-ui" font-size="28" font-weight="700">SaaS Launch Playbook</text>
  <text x="600" y="595" text-anchor="middle" fill="#666" font-family="system-ui" font-size="16">From MVP to $1M ARR</text>
</svg>
