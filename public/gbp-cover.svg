<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#00E5C0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00C9A7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00C9A7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#00C9A7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="576" fill="#000000"/>

  <!-- Ambient glows -->
  <rect width="1024" height="576" fill="url(#fadeRight)"/>
  <circle cx="300" cy="288" r="300" fill="url(#glowLeft)"/>
  <circle cx="850" cy="200" r="250" fill="url(#glowRight)"/>

