    <tspan fill="#00C9A7">●</tspan> Web Development  <tspan fill="#00C9A7">●</tspan> Mobile Apps  <tspan fill="#00C9A7">●</tspan> CRM Systems  <tspan fill="#00C9A7">●</tspan> SaaS Platforms  <tspan fill="#00C9A7">●</tspan> Warehouse Dashboards  <tspan fill="#00C9A7">●</tspan> AI Automation
  </text>

  <!-- Location -->
  <text x="420" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
