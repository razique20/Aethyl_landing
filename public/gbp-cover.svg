    <line x1="60" y1="55" x2="60" y2="10" stroke="url(#accent)" stroke-width="2"/>
    <line x1="60" y1="55" x2="100" y2="77" stroke="url(#accent)" stroke-width="2"/>
    <line x1="60" y1="55" x2="20" y2="77" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="60" cy="10" r="3" fill="#00C9A7"/>
    <circle cx="100" cy="77" r="3" fill="#00C9A7"/>
    <circle cx="20" cy="77" r="3" fill="#00C9A7"/>
    <circle cx="60" cy="55" r="4" fill="url(#accent)"/>
